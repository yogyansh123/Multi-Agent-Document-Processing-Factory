# =============================================================================
# Render Blueprint Specification — Multi-Agent Document Processing Factory
# =============================================================================
# Deploys the FastAPI backend container to Render Free Web Service.
# Reference: https://render.com/docs/blueprint-spec
# =============================================================================

services:
  - type: web
    name: docfactory-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://localhost:3000"
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: 'https://.*\.vercel\.app'
