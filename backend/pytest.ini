[tool:pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    unit: Pure unit tests with no I/O
    integration: Tests that require running services (DB, Redis, etc.)
    slow: Tests that take > 1 second
